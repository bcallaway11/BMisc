name: Reverse Dependency Check

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Reverse dependency source to check"
        required: true
        type: choice
        default: github
        options:
          - cran
          - github
          - both
      github_repos:
        description: "Comma-separated GitHub repos to check"
        required: false
        default: "bcallaway11/did,bcallaway11/qte,bcallaway11/contdid,bcallaway11/ptetools,pedrohcgs/DRDID"
      cran_packages:
        description: "Optional comma-separated CRAN package subset"
        required: false
        default: ""

jobs:
  revdep_check:
    runs-on: ubuntu-latest

    name: Lightweight revdep check (${{ inputs.source }})

    env:
      REVDEP_SOURCE: ${{ inputs.source }}
      REVDEP_GITHUB_REPOS: ${{ inputs.github_repos }}
      REVDEP_CRAN_PACKAGES: ${{ inputs.cran_packages }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            gfortran \
            libblas-dev \
            liblapack-dev

      - name: Install R dependencies and local BMisc
        run: |
          Rscript -e 'install.packages(c("remotes", "rcmdcheck"))'
          Rscript -e 'remotes::install_deps(".", dependencies = TRUE, upgrade = "never")'
          Rscript -e 'remotes::install_local(".", dependencies = FALSE, upgrade = "never", force = TRUE)'

      - name: Run lightweight reverse dependency checks
        run: |
          Rscript .github/scripts/lightweight-revdep-check.R

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reverse-Dependency-Check-Results
          path: revdep-results/
