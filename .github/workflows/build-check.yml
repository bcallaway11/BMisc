name: Build Check

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::devtools
            any::rmarkdown
          needs: website

      - name: Install package
        run: devtools::install(dependencies = FALSE, quiet = TRUE)
        shell: Rscript {0}

      - uses: quarto-dev/quarto-actions/setup@v2
        if: hashFiles('README.qmd') != ''

      - name: Build README
        if: hashFiles('README.Rmd') != ''
        run: devtools::build_readme()
        shell: Rscript {0}

      - name: Build README (Quarto)
        if: hashFiles('README.qmd') != ''
        run: quarto render README.qmd

      - name: Build pkgdown site
        run: pkgdown::build_site(preview = FALSE, install = FALSE)
        shell: Rscript {0}
